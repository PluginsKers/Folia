name: Patch and Build

on:
  push:
    branches-ignore:
      - ver/26.3.x
  pull_request:

jobs:
  build:
    # Only run on PRs if the source branch is on someone else's repo
    if: ${{ github.event_name != 'pull_request' || github.repository != github.event.pull_request.head.repo.full_name }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Git Repository
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build pinned LeafPile dependency
        working-directory: leafpile
        run: |
          ./gen_sources.sh
          ./gradlew :concurrentutil:publishToMavenLocal --no-daemon

      - name: Apply Patches
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "GitHub Actions"
          ./gradlew applyAllPatches --stacktrace

      - name: Build
        run: ./gradlew build createPaperclipJar --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: folia-paperclip
          path: folia-server/build/libs/folia-paperclip-*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
