name: Patch and Build

on:
  push:
    branches: [kers/26.3.x]
  pull_request:
    branches: [kers/26.3.x]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/kers/26.3.x

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Apply patches
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          ./gradlew --no-daemon applyAllPatches --stacktrace

      - name: Build and check
        run: ./gradlew --no-daemon build createPaperclipJar --stacktrace

      - name: Collect Paperclip and checksum
        shell: bash
        run: |
          shopt -s nullglob
          jars=(folia-server/build/libs/folia-paperclip-*.jar)
          test "${#jars[@]}" -eq 1
          mkdir -p dist
          cp "${jars[0]}" dist/folia.jar
          cd dist
          sha256sum folia.jar > SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: folia-paperclip
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
